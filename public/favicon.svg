  />

  <!-- Inner car cut-out -->
  <path
    d="M143 188
       C184 166 227 151 279 141
       C340 129 402 131 460 140
       C506 147 548 156 594 162
       C550 163 508 168 466 174
       C411 182 355 186 300 183
       C246 180 197 177 143 188Z"
