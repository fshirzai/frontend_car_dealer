    stroke-linecap="round"
  />

  <!-- Lower vehicle body -->
  <path
    d="M154 207
       C203 199 250 201 299 207
       C360 214 421 213 480 205
       C530 199 574 190 618 184"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- ========================= -->
  <!-- TAHIRIAN                   -->
  <!-- ========================= -->

  <text
    x="400"
    y="285"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="92"
    font-weight="900"
    font-style="italic"
    letter-spacing="-5"
  >
    TAHIRIAN
  </text>

  <!-- ========================= -->
  <!-- Tagline                    -->
  <!-- ========================= -->

  <text
    x="400"
    y="319"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
