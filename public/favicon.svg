  <!-- Rear/left speed stroke -->
  <path
    d="M86 213
       C118 197 143 190 174 188"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Front speed stroke -->
  <path
    d="M620 172
       C651 169 680 168 711 168"
