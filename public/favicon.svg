  viewBox="0 0 800 420"
  width="800"
  height="420"
  fill="none"
>
  <!-- Background -->
  <rect width="800" height="420" fill="#000000"/>

  <!-- ========================= -->
  <!-- Car / Speed Silhouette     -->
  <!-- ========================= -->

  <!-- Main aerodynamic car roof/body line -->
  <path
    d="M105 207
       C145 172 202 145 270 131
       C335 118 405 119 474 130
       C532 139 590 151 657 157
       C674 159 689 163 700 168
       C677 169 652 170 625 172
       C583 175 548 181 514 186
       C467 193 422 197 376 198
       C313 199 253 193 194 190
       C160 189 130 196 105 207Z"
